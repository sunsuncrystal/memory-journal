<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆日记</title>
<meta name="theme-color" content="#2A7A68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记忆日记">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#EDF3F2;--card:#FFFFFF;--ink:#13302F;--soft:#4F6B69;--jade:#2A7A68;--jadeInk:#FFFFFF;--warn:#B4472F;--line:#C9DBD8;
--call:#1D5BB8;--callInk:#FFFFFF;--amber:#9A5B00;--amberBg:#FFF3DC;--okBg:#E3F4EE;--grayBg:#EEF1F4;--gray:#4A5866;--recent:rgba(214,150,40,.16);--scale:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E1D;--card:#182C2A;--ink:#EAF4F2;--soft:#A9C4C0;--jade:#5BC2A8;--jadeInk:#06201A;--warn:#F08A70;--line:#2B4744;--call:#7FB0F5;--callInk:#071A33;--amber:#F2B65A;--amberBg:#3A2C12;--okBg:#163A31;--grayBg:#22303A;--gray:#B8C6D2;--recent:rgba(242,182,90,.14)}}
:root[data-theme="dark"]{--bg:#0F1E1D;--card:#182C2A;--ink:#EAF4F2;--soft:#A9C4C0;--jade:#5BC2A8;--jadeInk:#06201A;--warn:#F08A70;--line:#2B4744;--call:#7FB0F5;--callInk:#071A33;--amber:#F2B65A;--amberBg:#3A2C12;--okBg:#163A31;--grayBg:#22303A;--gray:#B8C6D2;--recent:rgba(242,182,90,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(21px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:1rem;line-height:1.5;overscroll-behavior-y:none}
.screen{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);min-height:100vh}
.screen[hidden]{display:none}
select,input,textarea{font:inherit;font-size:max(16px,1rem);padding:.5rem .65rem;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
select{width:auto}
button{font:inherit;font-weight:700;font-size:1.05rem;min-height:3.2rem;padding:.55rem .9rem;border-radius:18px;border:2.5px solid var(--jade);background:var(--card);color:var(--ink);cursor:pointer;width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button:active{transform:scale(.98)}
button.main{background:var(--jade);color:var(--jadeInk)}
button.small{min-height:2.4rem;font-size:.85rem;width:auto;border-width:2px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--warn);outline-offset:2px}
.big{min-height:4rem;font-size:1.2rem;border-radius:22px}
.call{background:var(--call);border-color:var(--call);color:var(--callInk)}
.row{display:grid;gap:12px}
.sub{color:var(--soft);margin:0 0 .6rem}
.status{color:var(--soft);font-size:.9rem;margin:.4rem 0 0;min-height:1.5em}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
h2{font-size:1.15rem;margin:0 0 .5rem}
h3{font-size:1rem;margin:.8rem 0 .3rem}
/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:1.75rem;font-weight:800;margin:.5rem 0 0;line-height:1.2}
.clock{font-size:1.2rem;font-weight:600;color:var(--soft)}
.plan{color:var(--soft);margin:.2rem 0 .8rem;font-size:.95rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .big{font-size:1rem;padding:.5rem .3rem;min-height:5rem;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pair .pic{font-size:1.7rem;line-height:1.1}
#topStatus{min-height:0;margin:.4rem 0}
.tiles{display:grid;margin-top:4px;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:24px;padding:.6rem .4rem;font-size:1.15rem;line-height:1.25}
.tile .ic{font-size:2.4rem;line-height:1.1}
.tile .st{font-size:.8rem;font-weight:600;color:var(--soft);margin-top:2px}
.tile.done{background:var(--okBg)}
.tile.todo .st{color:var(--warn)}
.vcard{background:var(--amberBg);border:2.5px solid var(--amber);border-radius:22px;padding:14px;margin:4px 0 14px}
.vcard[hidden]{display:none}
.vcard p{font-size:1.2rem;font-weight:800;margin:0 0 10px;line-height:1.35}
.vcard.soft{background:var(--okBg);border-color:var(--jade)}
.vhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.vhead p{flex:1;min-width:0;margin:0;background:var(--card);border-radius:18px;padding:10px 12px;position:relative}
.vhead p::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--card)}
.pet{flex:none;width:88px;height:88px;display:block}
.hdr{display:flex;align-items:center;gap:8px}
.hl{flex:1;min-width:0}
.hpet{position:relative;flex:none}
.hpet[hidden]{display:none}
.hpet .pet{width:92px;height:92px}
.petTog{display:block;width:100%;min-height:2.2rem;padding:.15rem .3rem;margin-top:2px;font-size:.78rem;border-width:2px;border-radius:14px;white-space:nowrap}
/* quiet Mimi: stands still, no speaker badge, taps do nothing */
body.petQuiet .pet svg{animation:none!important}
body.petQuiet .pet::after{display:none}
body.petQuiet .pet{cursor:default}
.pet.dance svg{animation:dance 2.4s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-9deg) translateY(-6px)}30%{transform:rotate(0) translateY(0)}45%{transform:rotate(9deg) translateY(-6px)}60%{transform:rotate(0) translateY(0)}75%{transform:translateY(-10px) scale(1.04)}}
.hbub{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:2px;width:max-content;max-width:min(230px,62vw);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800;font-size:1rem;line-height:1.35;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hbub[hidden]{display:none}
@media (max-width:359px){.hpet .pet{width:70px;height:70px}}
.pet{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
.pet::after{content:"🔊";position:absolute;left:-2px;bottom:2px;font-size:.75rem;line-height:1;padding:4px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.night .pet::after{background:#1B2638}
.pet.talk svg{animation:talk .45s ease-in-out 2}
@keyframes talk{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) translateY(-4px)}75%{transform:rotate(6deg) translateY(-4px)}}
.pet svg{width:100%;height:100%;display:block;animation:bob 2.8s ease-in-out infinite;transform-origin:50% 90%}
.pet.cheer svg{animation:hop .5s ease-out 2,bob 2.8s ease-in-out 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pet svg,.pet.cheer svg,.pet.dance svg{animation:none}}
.petbox{background:var(--okBg);border-radius:22px;padding:12px;margin:4px 0 6px}
.petbox p{font-size:1.15rem;font-weight:800;line-height:1.35}
/* night: dim, warm, high-contrast, whatever the phone theme */
body.nightOn{background:#0B1220}
.screen.night{background:#0B1220;color:#F3E9D2}
.nclock{font-size:2.8rem;font-weight:800;text-align:center;color:#C9B98F;margin:.4rem 0 .6rem}
.night .vhead p{background:#1B2638;color:#F3E9D2;font-size:1.25rem;font-weight:800;line-height:1.4}
.night .vhead p::before{border-right-color:#1B2638}
.ntips{list-style:none;padding:0;margin:6px 0 16px;display:grid;gap:8px}
.ntips li{background:#141D2C;border-radius:16px;padding:10px 14px;font-size:1.1rem;font-weight:700}
.night button{background:#16202F;color:#F3E9D2;border-color:#C9A25B}
.night button.main{background:#C9A25B;color:#1A1408}
.night .call{background:#2C4B7A;border-color:#2C4B7A;color:#fff}
.night .row .big{min-height:5.2rem;font-size:1.35rem}
.nsmall{margin-top:16px}
#statsTable td:not(:first-child),#statsTable th:not(:first-child){text-align:right}
.tile.wide{grid-column:1/-1;min-height:4.4rem;flex-direction:row;gap:10px}
.tile.wide .ic{font-size:1.8rem}
.tile.wide[hidden]{display:none}
.tag{background:var(--warn);color:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;margin-left:6px;vertical-align:middle}
.vrow{border-top:2px solid var(--line);padding:12px 0}
.vrow:first-child{border-top:0}
.vrow .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.vrow .big{margin-top:6px}
.rec-on{background:var(--warn)!important;border-color:var(--warn)!important;color:#fff!important}
.gate{position:relative;overflow:hidden;margin-top:28px;min-height:2.6rem;font-size:.8rem;font-weight:600;color:var(--soft);border:2px dashed var(--line);background:transparent}
.gate .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--okBg);transition:none}
.gate.holding .fill{width:100%;transition:width 1.5s linear}
.gate .gl{position:relative}
/* sub-screens */
.bar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 6px) 0 8px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar .back{width:auto;min-width:6.2rem;min-height:3rem;font-size:1rem}
.bar h1{font-size:1.35rem;margin:0;line-height:1.2}
.huge{font-size:1.35rem;font-weight:700;margin:.6rem 0 1rem;line-height:1.4}
.qstep{color:var(--soft);font-size:.9rem;margin:.6rem 0 0}
.bigq{font-size:1.45rem;font-weight:800;margin:.3rem 0 1rem;line-height:1.35}
.vchoices{display:grid;gap:12px}
.vchoices button{min-height:4.4rem;font-size:1.3rem;text-align:left;padding-left:1.1rem;border-radius:22px}
.vchoices button[aria-pressed="true"]{background:var(--jade);color:var(--jadeInk)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.5rem 0}
.chips button{width:auto;min-height:2.8rem;font-size:.95rem;border-radius:999px}
.entry{border-top:2px solid var(--line);padding:12px 0}
.entry:first-child{border-top:0}
.when{color:var(--soft);font-size:.85rem}
.entry .acts{display:flex;gap:8px;margin-top:6px}
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:10px 0;min-height:4rem;font-size:1.15rem}
.todo .tt{color:var(--jade);font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.todo .box{font-size:1.6rem;line-height:1}
.todo.done{opacity:.55;text-decoration:line-through}
.timer{font-size:2.6rem;font-weight:800;text-align:center;margin:.4rem 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:3rem;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jadeInk)}
.banner{position:sticky;top:0;z-index:5;background:var(--amberBg);color:var(--ink);border-bottom:2px solid var(--amber);padding:calc(env(safe-area-inset-top,0px) + 6px) 14px 6px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.8rem}
.banner[hidden]{display:none}
/* game */
#game{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#game[hidden]{display:none}
#game h2{font-size:1.4rem}
#dot{width:min(72vw,320px);height:min(72vw,320px);border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:1.7rem;font-weight:800}
#dot.go{background:#1F9D55;color:#fff}
/* family & doctor (denser, for adults reading a report) */
.fam{font-size:.88rem}
.fam button{font-size:.95rem}
.fam .bar h1{font-size:1.2rem}
.lbl{font-weight:700;margin:.8rem 0 .3rem}
.group{margin:20px 0 6px;padding-left:8px;font-size:.78rem;font-weight:700;color:var(--soft);letter-spacing:.02em}
.list{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.list.flat{border:0;border-radius:0;background:transparent}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:3.7rem;border:0;border-top:1.5px solid var(--line);border-radius:0;background:transparent;text-align:left;padding:.55rem .9rem;font-weight:700}
.li:first-child{border-top:0}
.li:active{transform:none;background:var(--okBg)}
.li .ico{width:2.3rem;height:2.3rem;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;flex:none;background:var(--okBg)}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.li .tx small{font-weight:500;color:var(--soft);font-size:.8rem;margin-top:2px}
.med .small{flex:none;white-space:nowrap}
.li .chev{color:var(--soft);font-size:1.5rem;font-weight:400}
.li.done .ico{background:var(--jade);color:var(--jadeInk)}
.li.done .tx>span{color:var(--soft);text-decoration:line-through}
.list.flat .li{padding-left:0;padding-right:0}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:20px;padding:16px;margin:8px 0 6px;min-height:0}
.hero.review{background:var(--amberBg);border-color:var(--amber)}
.hero.ok{background:var(--okBg);border-color:var(--jade)}
.hero.abstain{background:var(--grayBg);border-color:var(--gray)}
.hero .pill{font-size:1.05rem;font-weight:800}
.hero .hsum{font-weight:500;font-size:.85rem;color:var(--ink)}
.hero .more{font-size:.85rem;color:var(--jade)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .3s}
.tier{border-radius:16px;padding:14px 16px;margin:6px 0 12px;border:2px solid}
.tier.review{background:var(--amberBg);border-color:var(--amber)}
.tier.ok{background:var(--okBg);border-color:var(--jade)}
.tier.abstain{background:var(--grayBg);border-color:var(--gray)}
.tier b{font-size:1.15rem;display:block}
.small-t{font-size:.82rem;color:var(--soft)}
.reasons{margin:6px 0 0;padding-left:22px}
.reasons li{margin:4px 0}
.cite{font-size:.7rem;font-weight:700;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.75rem;margin:4px 0 0}
.pipe span{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.pipe i{font-style:normal;color:var(--soft)}
.chart{margin:4px 0 14px}
.chart svg{width:100%;height:auto;display:block}
.chart .lab{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.chart .lab span{font-weight:400;color:var(--soft);font-size:.75rem}
.legend{font-size:.75rem;color:var(--soft);display:flex;flex-wrap:wrap;gap:14px}
table{border-collapse:collapse;width:100%;font-size:.78rem}
th,td{text-align:left;padding:6px;border-bottom:1.5px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600}
.pass{color:var(--jade);font-weight:700}
.fail{color:var(--warn);font-weight:700}
.med{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1.5px solid var(--line);padding:10px 0}
.med:first-child{border-top:0}
.chip{display:inline-block;font-size:.7rem;border-radius:999px;padding:1px 9px;margin:3px 4px 0 0;border:1.5px solid var(--line)}
.chip.sed{border-color:var(--amber);color:var(--amber)}
.chip.beers{border-color:var(--warn);color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.7rem}
.trace li{margin:4px 0}
.disc{font-size:.78rem;color:var(--soft);border-top:1.5px solid var(--line);padding-top:10px;margin-top:12px}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:700;min-height:2.4rem;font-size:1rem}
@media print{
 body{background:#fff;color:#000}
 .screen{display:none!important}
 #sc-famReport{display:block!important;font-size:12px}
 .noprint,.bar,.banner,#game{display:none!important}
 .card{border:1px solid #999;break-inside:avoid}
}
</style>
</head>
<body>
<div class="banner" id="demoBar" hidden><span id="demoText"></span><button class="small" id="demoExit"></button></div>

<!-- ============ HOME ============ -->
<section class="screen" id="sc-home">
 <div class="top">
  <select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="es">Español</option></select>
  <button class="small" id="readDay"></button>
 </div>
 <div class="date" id="date"></div>
 <div class="hdr">
  <div class="hl"><div class="clock" id="clock"></div><p class="plan" id="plan"></p></div>
  <div class="hpet" id="homePetBox"><span class="hbub" id="homeBub" hidden></span><span class="pet dance" id="homePet" role="button" tabindex="0"></span><button class="petTog" id="petTog"></button></div>
 </div>
 <div class="pair">
  <button class="big main" id="home"></button>
  <button class="big call" id="call"></button>
 </div>
 <p class="status" id="topStatus"></p>
 <div class="vcard" id="voiceCard" hidden><div class="vhead"><span class="pet" role="button" tabindex="0" id="vcPet"></span><p id="vcText"></p></div><div class="row" id="vcBtns"></div></div>
 <div class="tiles">
  <button class="tile" data-go="med"><span class="ic">💊</span><span data-t="tileMed"></span><span class="st" id="stMed"></span></button>
  <button class="tile" data-go="check"><span class="ic">🌅</span><span data-t="tileCheck"></span><span class="st" id="stCheck"></span></button>
  <button class="tile" data-go="walk"><span class="ic">🚶</span><span data-t="tileWalk"></span><span class="st" id="stWalk"></span></button>
  <button class="tile" data-go="journal"><span class="ic">📖</span><span data-t="tileJournal"></span><span class="st" id="stJournal"></span></button>
  <button class="tile" data-go="todo"><span class="ic">☑️</span><span data-t="tileTodo"></span><span class="st" id="stTodo"></span></button>
  <button class="tile" data-go="ask"><span class="ic">❓</span><span data-t="tileAsk"></span><span class="st" data-t="stAsk"></span></button>
  <button class="tile wide" data-go="voices" id="voiceTile" hidden><span class="ic">💌</span><span id="voiceTileL"></span></button>
 </div>
 <button class="gate" id="gate"><span class="fill"></span><span class="gl" id="gateL"></span></button>
</section>

<!-- ============ MEDICINE ============ -->
<section class="screen" id="sc-med" hidden>
 <div class="bar"><button class="back" data-back></button><h1 data-t="tMed"></h1></div>
 <p class="huge" id="medStatus"></p>
 <button class="big main" id="med"></button>
 <p class="status" id="medNote"></p>
</section>

<!-- ============ CHECK-IN (one question per screen) ============ -->
<section class="screen" id="sc-check" hidden>
 <div class="bar"><button class="back" data-back></button><h1 data-t="tCheck"></h1></div>
 <div id="checkBody"></div>
</section>

<!-- ============ WALK ============ -->
<section class="screen" id="sc-walk" hidden>
 <div class="bar"><button class="back" data-back></button><h1 data-t="tWalkT"></h1></div>
 <div id="walkIdle">
  <p class="sub" data-t="dest"></p>
  <input id="dest" aria-label="Destination">
  <div class="chips" id="places"></div>
  <div class="row" style="margin-top:12px">
   <button class="big main" id="goWalk"></button>
   <button id="route"></button>
  </div>
 </div>
 <div id="walkOn" hidden>
  <p class="huge" id="walkStatus"></p>
  <div class="timer" id="walkTimer"></div>
  <div class="row">
   <button class="big main" id="backWalk"></button>
   <button class="big" id="homeWalk"></button>
  </div>
 </div>
 <p class="status" id="walkMsg"></p>
 <div id="reassure"></div>
 <div class="card"><h2 data-t="tWalkLog"></h2><div id="walkLog"></div></div>
</section>

<!-- ============ JOURNAL ============ -->
<section class="screen" id="sc-journal" hidden>

function taskParse(x){

 if(m){h=+m[1];mi=+m[2];rest=m[3]}
 else if((m=x.match(/^\s*(上午|早上|中午|下午|晚上)?\s*(\d{1,2})\s*点\s*(半|(\d{1,2})\s*分?)?\s*(.*)$/))){h=+m[2];if(/下午|晚上/.test(m[1]||"")&&h<12)h+=12;mi=m[3]==="半"?30:m[4]?+m[4]:0;rest=m[5]}
 if(m&&h<24&&mi<60&&rest)return {raw:x,time:pad(h)+":"+pad(mi),name:rest};

function toMin(hm){var p=hm.split(":");return +p[0]*60+ +p[1]}

function icsText(s){return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n")}
function calEvents(){
 var ev=[S.medTime,S.medTime2].filter(Boolean).map(function(tm){return {time:tm,title:t("calTitle"),desc:t("calDesc"),id:"med"}});
 todoItems().map(taskParse).filter(function(k){return k.time}).forEach(function(k,i){ev.push({time:k.time,title:"⏰ "+k.name,desc:t("taskHelp"),id:"task"+i})});
 return ev}
function buildICS(times,now){
 var d=new Date(now||Date.now()),day=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
 var stamp=new Date(now||Date.now()).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
 var url=location.protocol.indexOf("http")===0?location.origin+location.pathname:"";
 var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Memory Journal//SafeSleep//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
 times.forEach(function(e){if(typeof e==="string")e={time:e,title:t("calTitle"),desc:t("calDesc"),id:"med"};var hm=e.time.replace(":","");
  L.push("BEGIN:VEVENT","UID:memjournal-"+e.id+"-"+hm+"@memory-journal","DTSTAMP:"+stamp,"DTSTART:"+day+"T"+hm+"00","DURATION:PT10M","RRULE:FREQ=DAILY",
   "SUMMARY:"+icsText(e.title),"DESCRIPTION:"+icsText(e.desc));
  if(url)L.push("URL:"+url);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(e.title),"TRIGGER:PT0M","END:VALARM","END:VEVENT")});
 L.push("END:VCALENDAR");return L.join("\r\n")+"\r\n"}
function saveFile(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
$("calBtn").onclick=$("calBtn2").onclick=function(){

 buzz();var ics=buildICS(ev);
 /* iPhone Safari offers "Add to Calendar" when it opens calendar data directly; elsewhere a downloaded .ics opens in the calendar app */

 else saveFile(new Blob([ics],{type:"text/calendar"}),"medicine-reminder.ics")};

var REC={};

  var type=["audio/mp4","audio/webm;codecs=opus","audio/webm"].filter(function(x){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)})[0];
  var mr=new MediaRecorder(st,type?{mimeType:type}:undefined),chunks=[];
  REC={target:target,mr:mr,t0:Date.now()};
  mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=function(){var dur=recSecs();clearInterval(REC.timer);st.getTracks().forEach(function(tr){tr.stop()});
   var tg=REC.target;REC={};storeClip(tg,new Blob(chunks,{type:mr.mimeType||type||"audio/webm"}),dur)};
  mr.start();
  REC.timer=setInterval(function(){if(recSecs()>=60)stopRec();else renderVoiceSet()},1000);
  renderVoiceSet()}).catch(function(){vstatus(t("recDenied"))})}

  else{S.voiceMeta=S.voiceMeta||{};S.voiceMeta[target]={ts:Date.now(),dur:dur}}
  save();render();vstatus(t("recSaved"))}).catch(function(){vstatus(t("recFail"))})}

 var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}

$("call").onclick=function(){buzz();if(!S.phone){msg("topStatus",t("needPhone"));return}msg("topStatus",t("calling"));var a=document.createElement("a");a.href="tel:"+S.phone.replace(/[^0-9+]/g,"");document.body.appendChild(a);a.click();a.remove()};
var medArmed=false;
$("med").onclick=function(){
 buzz();var tm=todayMeds();
 if(tm.length&&!medArmed){medArmed=true;S.dup[today()]=1;save(); /* a repeat-dose attempt is itself a memory/safety signal */
  msg("medNote",t("medDone").replace("{t}",fmtTime(tm[tm.length-1]))+" "+t("medAgain"));setTimeout(function(){medArmed=false;$("medNote").textContent=""},15000);return}
 medArmed=false;S.meds.push(Date.now());useInc("medTaken");S.meds=S.meds.slice(-120);save();renderMed();
 var note=$("medStatus").textContent+" "+t("autoBack");
 if(!S.petQuiet&&(S.voiceMeta||{}).medDone){$("medNote").textContent=note;voiceOr("medDone",null,function(){if(SCREEN==="med")goBack()})} /* praise in the family's voice, then home */
 else{msg("medNote",note);setTimeout(function(){if(SCREEN==="med")goBack()},2500)}};
$("goWalk").onclick=function(){buzz();S.walk={dest:$("dest").value.trim()||"…",ts:Date.now()};$("dest").value="";save();render();if(!S.petQuiet)voiceOr("walk",chatty()?$("walkStatus").textContent:null)};
$("backWalk").onclick=function(){
 buzz();var w=S.walk;
 S.walks.unshift({dest:w.dest,start:w.ts,end:Date.now()});S.walks=S.walks.slice(0,200);
 S.walk=null;S.pendingWalk=true;save();
 show("journal");$("micStatus").textContent=t("back2");if(!S.petQuiet)voiceOr("home",t("back2"))};
$("addr").onchange=function(){S.addr=this.value;save()};
$("phone").onchange=function(){S.phone=this.value;save()};
$("todoSet").onchange=function(){S.todo=this.value;save()};
$("save").onclick=function(){
 var v=$("text").value.trim();if(!v)return;buzz();
 S.entries.unshift({ts:Date.now(),text:v,kind:S.pendingWalk?"walk":"day"});S.pendingWalk=false;
 $("text").value="";save();renderJournal();msg("micStatus",t("saved"))};
$("medName").oninput=function(){var n=normalizeMed(this.value);$("medPreview").textContent=!this.value.trim()?"":n?fmt(t("medMatch"),{i:n.ing,c:t("cls_"+n.cls)}):t("medUnknown")};
$("medAdd").onclick=function(){var v=$("medName").value.trim();if(!v)return;S.medList.push({name:v,start:$("medStart").value||today()});$("medName").value="";$("medPreview").textContent="";save();render()};
$("exp").onclick=function(){
 exportAll().then(function(r){saveFile(new Blob([r.json],{type:"application/json"}),"safesleep-"+today()+".json");$("dataStatus").textContent=fmt(t("expOk"),{n:r.n})})};
$("impBtn").onclick=function(){$("imp").click()};
$("imp").onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result),clips=d._clips;delete d._clips;if(REAL){S=REAL;REAL=null}Object.assign(S,d);delete S.demo;save();
  importClips(clips).then(function(n){render();$("dataStatus").textContent=n?fmt(t("impOkV"),{n:n}):t("impOk")})}catch(e){$("dataStatus").textContent=t("impBad")}};fr.readAsText(f)};

var rec=null;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=function(){
 if(!SR){$("micStatus").textContent=t("nomic");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=t("loc");rec.interimResults=true;rec.continuous=true;
 var base=$("text").value;
 rec.onresult=function(ev){var s="";for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;$("text").value=(base?base+" ":"")+s};
 rec.onerror=function(ev){$("micStatus").textContent=t("micErr")+" ("+(ev&&ev.error||"?")+")"};
 rec.onend=function(){rec=null;$("mic").textContent=t("mic");if($("micStatus").textContent===t("listen"))$("micStatus").textContent=""};
 try{speechSynthesis.cancel()}catch(e){}
 try{rec.start();$("micStatus").textContent=t("listen");$("mic").textContent=t("stop")}catch(e){rec=null;$("micStatus").textContent=t("micErr")}};

/* Reaction-time check-in: 5 rounds, false starts are repeated, the median is stored */
var G=null;
function gRound(){
 G.state="wait";$("dot").className="";$("dot").textContent=t("gWait");$("gRound").textContent=fmt(t("gRound"),{i:G.times.length+1,n:G.n});
 G.timer=setTimeout(function(){G.state="go";G.t0=performance.now();$("dot").className="go";$("dot").textContent=t("gTap");$("gStatus").textContent=""},1500+Math.random()*2500)}
function startGame(){G={n:5,times:[]};$("gTitle").textContent=t("gTitle");$("gClose").textContent=t("gClose");$("gStatus").textContent="";$("game").hidden=false;if(!S.petQuiet)speak(t("gTitle"));setTimeout(gRound,1200)}
$("dot").onpointerdown=function(e){
 e.preventDefault();if(!G)return;
 if(G.state==="wait"){clearTimeout(G.timer);G.state="pause";$("gStatus").textContent=t("gEarly");setTimeout(gRound,1300);return}
 if(G.state!=="go")return;
 buzz();G.times.push(performance.now()-G.t0);G.state="pause";$("dot").className="";$("dot").textContent="✓";
 if(G.times.length<G.n){setTimeout(gRound,700);return}
 var ms=Math.round(median(G.times));ci().rt=ms;save();
 G.state="done";$("dot").textContent="🎉";$("gClose").textContent=t("cont");msg("gStatus",fmt(t("gResult"),{s:(ms/1000).toFixed(2)}))};
$("gClose").onclick=function(){var finished=G&&G.state==="done";if(G)clearTimeout(G.timer);G=null;$("game").hidden=true;if(SCREEN==="check"){CK.step=finished?5:4;renderCheck()}};
function ci(){var k=today();return S.checkins[k]||(S.checkins[k]={})}

/* Ask my journal: find saved entries that share words with the question */
function tokens(str){
 str=str.toLowerCase();
 var words=str.match(/[a-z0-9áéíóúñü]{3,}/g)||[];
 var cjk=str.replace(/[^一-鿿]/g,"");
 for(var i=0;i<cjk.length-1;i++)words.push(cjk.substr(i,2));
 return words}
function search(q){
 var qt=tokens(q),out=[];
 S.entries.forEach(function(e){
  var txt=e.text.toLowerCase(),score=0;
  qt.forEach(function(w){if(txt.indexOf(w)>-1)score++});
  if(score>0)out.push({e:e,score:score})});
 out.sort(function(a,b){return b.score-a.score||b.e.ts-a.e.ts});
 return out.slice(0,3)}
function doAsk(){
 var q=$("q").value.trim(),box=$("askOut");box.innerHTML="";if(!q)return;
 var lines=[];
 if(/药|medic|pill|pastill/i.test(q)){
  var m=todayMeds();
  lines.push(m.length?t("askMed").replace("{t}",fmtTime(m[m.length-1])):t("askNoMed"))}
 var qt=tokens(q);
 S.walks.forEach(function(w,i){
  var hit=/散步|walk|paseo|pase/i.test(q)?i<3:qt.some(function(x){return w.dest.toLowerCase().indexOf(x)>-1});
  if(hit)lines.push(t("askWalk").replace("{d}",w.dest).replace("{day}",fmtDay(w.start)+" "+fmtTime(w.start)))});
 search(q).forEach(function(r){lines.push(fmtDay(r.e.ts)+": "+r.e.text)});
 if(!lines.length)lines.push(t("askNone"));
 lines.forEach(function(l){box.appendChild(el("p",null,l))});
 if(!S.petQuiet)speak(lines[0])}
$("askGo").onclick=doAsk;
$("q").onkeydown=function(e){if(e.key==="Enter")doAsk()};
$("askMic").onclick=function(){
 if(!SR){$("askOut").textContent=t("nomic");return}
 var r=new SR();r.lang=t("loc");
 r.onresult=function(ev){$("q").value=ev.results[0][0].transcript;doAsk()};
 r.onerror=function(ev){$("askOut").textContent=t("micErr")+" ("+(ev&&ev.error||"?")+")"};
 try{speechSynthesis.cancel()}catch(e){}
 try{r.start()}catch(e){}};
