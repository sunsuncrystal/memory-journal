<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeSleep 记忆日记</title>
<style>
:root{--bg:#EDF3F2;--card:#FFFFFF;--ink:#13302F;--soft:#4F6B69;--jade:#2A7A68;--jadeInk:#FFFFFF;--warn:#B4472F;--line:#C9DBD8;
--amber:#9A5B00;--amberBg:#FFF3DC;--okBg:#E3F4EE;--grayBg:#EEF1F4;--gray:#4A5866;--recent:rgba(214,150,40,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E1D;--card:#182C2A;--ink:#EAF4F2;--soft:#9DBAB6;--jade:#5BC2A8;--jadeInk:#06201A;--warn:#F08A70;--line:#2B4744;--amber:#F2B65A;--amberBg:#3A2C12;--okBg:#163A31;--grayBg:#22303A;--gray:#B8C6D2;--recent:rgba(242,182,90,.14)}}
:root[data-theme="dark"]{--bg:#0F1E1D;--card:#182C2A;--ink:#EAF4F2;--soft:#9DBAB6;--jade:#5BC2A8;--jadeInk:#06201A;--warn:#F08A70;--line:#2B4744;--amber:#F2B65A;--amberBg:#3A2C12;--okBg:#163A31;--grayBg:#22303A;--gray:#B8C6D2;--recent:rgba(242,182,90,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:22px;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
select,input,textarea{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
select{width:auto}
.date{font-size:38px;font-weight:700;margin:14px 0 2px;line-height:1.2}
.sub{color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
h2{font-size:24px;margin:0 0 10px}
h3{font-size:20px;margin:14px 0 6px}
button{font:inherit;font-weight:600;font-size:22px;min-height:64px;padding:12px 18px;border-radius:16px;border:2px solid var(--jade);background:var(--card);color:var(--ink);cursor:pointer;width:100%}
button.main{background:var(--jade);color:var(--jadeInk)}
button.small{min-height:48px;font-size:18px;width:auto}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--warn);outline-offset:2px}
.row{display:grid;gap:12px}
.status{color:var(--soft);font-size:19px;margin:8px 0 0;min-height:1.5em}
.entry{border-top:2px solid var(--line);padding:12px 0}
.entry:first-child{border-top:0}
.when{color:var(--soft);font-size:18px}
details summary{cursor:pointer;font-weight:600;min-height:48px}
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:8px 0}
.todo .box{font-size:30px;line-height:1}
.todo.done{opacity:.55;text-decoration:line-through}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.tabs button{min-height:56px;font-size:20px}
.tabs button[aria-selected="true"]{background:var(--jade);color:var(--jadeInk)}
.banner{background:var(--amberBg);color:var(--ink);border:2px solid var(--amber);border-radius:14px;padding:10px 14px;margin:12px 0 0;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:18px}
/* check-in */
.q{margin:12px 0 4px;font-weight:600}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices button{min-height:60px;font-size:20px;padding:8px}
.choices button[aria-pressed="true"]{background:var(--jade);color:var(--jadeInk)}
/* game */
#game{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#game[hidden]{display:none}
#dot{width:min(70vw,320px);height:min(70vw,320px);border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:34px;font-weight:700}
#dot.go{background:#1F9D55;color:#fff}
/* family view */
.tier{border-radius:16px;padding:14px 16px;margin:6px 0 12px;border:2px solid}
.tier.review{background:var(--amberBg);border-color:var(--amber)}
.tier.ok{background:var(--okBg);border-color:var(--jade)}
.tier.abstain{background:var(--grayBg);border-color:var(--gray)}
.tier b{font-size:24px;display:block}
.small-t{font-size:17px;color:var(--soft)}
.reasons{margin:6px 0 0;padding-left:22px}
.reasons li{margin:4px 0}
.cite{font-size:14px;font-weight:700;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;margin:4px 0 0}
.pipe span{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px}
.pipe i{font-style:normal;color:var(--soft)}
.chart{margin:4px 0 14px}
.chart svg{width:100%;height:auto;display:block}
.chart .lab{font-size:17px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.chart .lab span{font-weight:400;color:var(--soft);font-size:15px}
.legend{font-size:15px;color:var(--soft);display:flex;flex-wrap:wrap;gap:14px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:6px 6px;border-bottom:1.5px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:600}
.pass{color:var(--jade);font-weight:700}
.fail{color:var(--warn);font-weight:700}
.med{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1.5px solid var(--line);padding:10px 0}
.med:first-child{border-top:0}
.chip{display:inline-block;font-size:14px;border-radius:999px;padding:1px 9px;margin:3px 4px 0 0;border:1.5px solid var(--line)}
.chip.sed{border-color:var(--amber);color:var(--amber)}
.chip.beers{border-color:var(--warn);color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.trace li{margin:4px 0;font-size:16px}
.disc{font-size:16px;color:var(--soft);border-top:1.5px solid var(--line);padding-top:10px;margin-top:12px}
.scroll{overflow-x:auto}
@media print{
 body{background:#fff;color:#000;font-size:14px}
 .noprint,.tabs,.top,#viewToday,#game,.banner button{display:none!important}
 #viewFamily{display:block!important}
 .card{border:1px solid #999;break-inside:avoid}
 button{display:none}
}
</style>
</head>
<body>
<main>
 <div class="top">
  <select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="es">Español</option></select>
  <button class="small" id="readDay"></button>
 </div>
 <div class="tabs" role="tablist">
  <button role="tab" id="tabToday" aria-selected="true"></button>
  <button role="tab" id="tabFam" aria-selected="false"></button>
 </div>
 <div class="banner" id="demoBar" hidden><span id="demoText"></span><button class="small" id="demoExit"></button></div>

 <!-- ============ TODAY (for the older adult) ============ -->
 <section id="viewToday">
 <div class="date" id="date"></div>
 <p class="sub" id="plan"></p>

 <div class="row">
  <button class="main" id="home"></button>
  <button id="call"></button>
 </div>
 <p class="status" id="topStatus"></p>

 <div class="card" id="checkCard">
  <h2 id="tCheck"></h2>
  <p class="q" id="qSleep"></p>
  <div class="choices" id="cSleep"></div>
  <p class="q" id="qWake"></p>
  <div class="choices" id="cWake"></div>
  <p class="q" id="qFall"></p>
  <div class="choices two" id="cFall"></div>
  <div style="margin-top:14px"><button class="main" id="gameBtn"></button></div>
  <p class="status" id="checkStatus"></p>
 </div>

 <div class="card">
  <h2 id="tMed"></h2>
  <button class="main" id="med"></button>
  <p class="status" id="medStatus"></p>
 </div>

 <div class="card">
  <h2 id="tTodo"></h2>
  <div id="todoList"></div>
  <p class="status" id="todoStatus"></p>
 </div>

 <div class="card">
  <h2 id="tWalk"></h2>
  <input id="dest" aria-label="Destination">
  <div class="row" style="margin-top:12px">
   <button id="route"></button>
   <button id="goWalk"></button>
   <button id="backWalk" hidden></button>
  </div>
  <p class="status" id="walkStatus"></p>
  <div id="reassure"></div>
 </div>

 <div class="card"><h2 id="tWalkLog"></h2><div id="walkLog"></div></div>

 <div class="card">
  <h2 id="tJournal"></h2>
  <textarea id="text" rows="4" aria-label="Journal"></textarea>
  <div class="row" style="margin-top:12px">
   <button class="main" id="mic"></button>
   <button id="save"></button>
  </div>
  <p class="status" id="micStatus"></p>
 </div>

 <div class="card">
  <h2 id="tAsk"></h2>
  <input id="q" aria-label="Question">
  <div class="row" style="margin-top:12px"><button class="main" id="askMic"></button><button id="askGo"></button></div>
  <div id="askOut" style="margin-top:12px"></div>
 </div>

 <div class="card"><h2 id="tPast"></h2><div id="list"></div></div>
 </section>

 <!-- ============ FAMILY & DOCTOR ============ -->
 <section id="viewFamily" hidden>
 <div class="card">
  <h2 id="tReport"></h2>
  <p class="small-t" id="reportSub" style="margin:0"></p>
  <div class="pipe" id="pipe"></div>
  <div id="tierBox"></div>
  <p class="small-t" id="glance"></p>
  <button class="small noprint" id="printBtn"></button>
 </div>

 <div class="card">
  <h2 id="tSignals"></h2>
  <div class="legend" id="legend"></div>
  <div id="charts"></div>
 </div>

 <div class="card" id="qsCard">
  <h2 id="tQs"></h2>
  <ul class="reasons" id="qs"></ul>
 </div>

 <div class="card">
  <h2 id="tMeds"></h2>
  <div id="medList"></div>
  <div class="noprint">
   <input id="medName" style="margin-top:10px">
   <p class="sub" id="medStartL" style="margin:8px 0 4px"></p>
   <input id="medStart" type="date">
   <p class="status" id="medPreview"></p>
   <button class="main" id="medAdd"></button>
  </div>
 </div>

 <details class="card" id="ledgerCard">
  <summary id="tLedger"></summary>
  <p class="sub" id="ledHead" style="margin:6px 0"></p>
  <div class="scroll"><table id="ledger"></table></div>
  <p class="sub" id="traceHead" style="margin:14px 0 4px"></p>
  <ol class="trace" id="trace"></ol>
 </details>

 <div class="card noprint" id="demoCard">
  <h2 id="tDemo"></h2>
  <p class="sub" id="demoHelp"></p>
  <div class="row" id="scenarios"></div>
  <div style="margin-top:12px"><button class="main" id="runTests"></button></div>
  <div class="scroll" id="testOut" style="margin-top:12px"></div>
 </div>

 <details class="card noprint">
  <summary id="tSet"></summary>
  <p class="sub" id="setHelp"></p>
  <input id="addr" aria-label="Home address" style="margin-bottom:12px">
  <input id="phone" type="tel" aria-label="Family phone" style="margin-bottom:12px">
  <p class="sub" id="todoSetLabel" style="margin:0 0 6px"></p>
  <textarea id="todoSet" rows="4" aria-label="Daily tasks" style="margin-bottom:12px"></textarea>
  <select id="maps" aria-label="Maps" style="width:100%;margin-bottom:12px"><option value="google">Google Maps</option><option value="apple">Apple Maps</option></select>
  <p class="sub" id="voiceLabel" style="margin:0 0 6px"></p>
  <select id="voice" aria-label="Voice" style="width:100%"></select>
  <button class="small" id="voiceTest" style="margin-top:12px"></button>
  <h3 id="tData"></h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="small" id="exp"></button><button class="small" id="impBtn"></button><input type="file" id="imp" accept="application/json" hidden></div>
  <p class="status" id="dataStatus"></p>
  <p class="sub" style="margin-top:12px" id="privacy"></p>
 </details>
 <p class="disc" id="disc"></p>
 </section>
</main>

<div id="game" hidden role="dialog" aria-modal="true">
 <h2 id="gTitle"></h2>
 <p class="sub" id="gRound"></p>
 <button id="dot"></button>
 <p class="status" id="gStatus" style="font-size:22px"></p>
 <button class="small" id="gClose"></button>
</div>

var rec=null;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=function(){
 if(!SR){$("micStatus").textContent=t("nomic");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=t("loc");rec.interimResults=true;rec.continuous=true;
 var base=$("text").value;
 rec.onresult=function(ev){var s="";for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;$("text").value=(base?base+" ":"")+s};
 rec.onerror=function(ev){$("micStatus").textContent=t("micErr")+" ("+(ev&&ev.error||"?")+")"};
 rec.onend=function(){rec=null;$("mic").textContent=t("mic");if($("micStatus").textContent===t("listen"))$("micStatus").textContent=""};
 try{rec.start();$("micStatus").textContent=t("listen");$("mic").textContent=t("stop")}catch(e){rec=null;$("micStatus").textContent=t("micErr")}};

/* Reaction-time check-in: 5 rounds, false starts are repeated, the median is stored */
var G=null;
function gRound(){
 G.state="wait";$("dot").className="";$("dot").textContent=t("gWait");$("gRound").textContent=fmt(t("gRound"),{i:G.times.length+1,n:G.n});
 G.timer=setTimeout(function(){G.state="go";G.t0=performance.now();$("dot").className="go";$("dot").textContent=t("gTap");$("gStatus").textContent=""},1500+Math.random()*2500)}
$("gameBtn").onclick=function(){G={n:5,times:[]};$("gTitle").textContent=t("gTitle");$("gClose").textContent=t("gClose");$("gStatus").textContent="";$("game").hidden=false;speak(t("gTitle"));gRound()};
$("dot").onpointerdown=function(e){
 e.preventDefault();if(!G)return;
 if(G.state==="wait"){clearTimeout(G.timer);G.state="pause";$("gStatus").textContent=t("gEarly");setTimeout(gRound,1300);return}
 if(G.state!=="go")return;
 G.times.push(performance.now()-G.t0);G.state="pause";$("dot").className="";$("dot").textContent="✓";
 if(G.times.length<G.n){setTimeout(gRound,700);return}
 var ms=Math.round(median(G.times));ci().rt=ms;save();
 G.state="done";$("dot").textContent="🎉";msg("gStatus",fmt(t("gResult"),{s:(ms/1000).toFixed(2)}))};
$("gClose").onclick=function(){if(G)clearTimeout(G.timer);G=null;$("game").hidden=true;render()};

/* Ask my journal: find saved entries that share words with the question */
function tokens(str){
 str=str.toLowerCase();
 var words=str.match(/[a-z0-9áéíóúñü]{3,}/g)||[];
 var cjk=str.replace(/[^一-鿿]/g,"");
 for(var i=0;i<cjk.length-1;i++)words.push(cjk.substr(i,2));
 return words}
function search(q){
 var qt=tokens(q),out=[];
 S.entries.forEach(function(e){
  var txt=e.text.toLowerCase(),score=0;
  qt.forEach(function(w){if(txt.indexOf(w)>-1)score++});
  if(score>0)out.push({e:e,score:score})});
 out.sort(function(a,b){return b.score-a.score||b.e.ts-a.e.ts});
 return out.slice(0,3)}
function doAsk(){
 var q=$("q").value.trim(),box=$("askOut");box.innerHTML="";if(!q)return;
 var lines=[];
 if(/药|medic|pill|pastill/i.test(q)){
  var m=S.meds.filter(function(x){return same(x,Date.now())});
  lines.push(m.length?t("askMed").replace("{t}",fmtTime(m[m.length-1])):t("askNoMed"))}
 var qt=tokens(q);
 S.walks.forEach(function(w,i){
  var hit=/散步|walk|paseo|pase/i.test(q)?i<3:qt.some(function(x){return w.dest.toLowerCase().indexOf(x)>-1});
  if(hit)lines.push(t("askWalk").replace("{d}",w.dest).replace("{day}",fmtDay(w.start)+" "+fmtTime(w.start)))});
 search(q).forEach(function(r){lines.push(fmtDay(r.e.ts)+": "+r.e.text)});
 if(!lines.length)lines.push(t("askNone"));
 lines.forEach(function(l){var p=document.createElement("p");p.textContent=l;box.appendChild(p)});
 speak(lines[0])}
$("askGo").onclick=doAsk;
$("q").onkeydown=function(e){if(e.key==="Enter")doAsk()};
$("askMic").onclick=function(){
 if(!SR){$("askOut").textContent=t("nomic");return}
 var r=new SR();r.lang=t("loc");
 r.onresult=function(ev){$("q").value=ev.results[0][0].transcript;doAsk()};
 r.onerror=function(ev){$("askOut").textContent=t("micErr")+" ("+(ev&&ev.error||"?")+")"};
 try{r.start()}catch(e){}};

load();
["checkins","seen","night","dup"].forEach(function(k){if(!S[k]||typeof S[k]!=="object")S[k]={}});if(!S.medList)S.medList=[];
if(!S.maps)S.maps=defaultMaps();touch();render();
</script>
